<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>FleetFlow | Smart Logistics Management</title>
    <meta name="description" content="Centralized logistics and fleet management system built with Supabase and React.">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FleetFlow">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">

    <!-- Android / Chrome PWA -->
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Open Graph / Previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FleetFlow | Smart Logistics">
    <meta property="og:description" content="Manage vehicles, drivers, and trips in one powerful dashboard.">

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; }
        .initial-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="initial-loader">
            <div style="text-align: center;">
                <div style="width: 72px; height: 72px; background: #0f172a; border-radius: 18px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(37, 99, 235, 0.3);">
                    <svg style="width: 40px; height: 40px; color: white;" fill="none" viewBox="0 0 24 24" stroke="white">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
                    </svg>
                </div>
                <h1 style="font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.025em;">FleetFlow</h1>
                <p style="color: #64748b; margin-top: 8px; font-size: 14px; font-weight: 500;">Logistics Managed Smarter.</p>
            </div>
        </div>
    </div>

    <script>
        // Register service worker for PWA with auto-update
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        reg.update();
                        console.log('FleetFlow SW registered:', reg.scope);
                    })
                    .catch(err => console.log('SW registration failed:', err));
            });
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });
        }
    </script>
</body>
</html>
